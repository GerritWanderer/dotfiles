onboarding = false
[terminal]
default_shell = "zsh"

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
agent_panel_sort = "spaces"

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+space"
detach = "prefix+q"
toggle_sidebar = "prefix+b"

new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
next_workspace = ["prefix+shift+n", "alt+down"]
previous_workspace = ["prefix+shift+p", "alt+up"]

switch_tab = ["prefix+1..9", "alt+1..9"]

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"
